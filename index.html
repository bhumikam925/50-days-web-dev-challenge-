<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Synexus</title>

    <link rel="stylesheet" href="style.css">

    <!-- Day 25 Master JavaScript -->
    <script src="app.js" defer></script>
</head>

<body>

    <!-- Skip Link -->
    <a href="#app-root" class="skip-link">
        Skip to main content
    </a>

    <!-- =========================
         HEADER / NAVIGATION
    ========================== -->

    <header>
        <nav>

            <h2>Synexus</h2>

            <button
                class="menu-toggle"
                aria-label="Toggle Menu">
                ☰
            </button>

            <ul class="nav-links">

                <li>
                    <a
                        href="/50-days-web-dev-challenge-/"
                        class="nav-link">
                        Home
                    </a>
                </li>

                <li>
                    <a
                        href="/50-days-web-dev-challenge-/about"
                        class="nav-link">
                        About
                    </a>
                </li>

                <li>
                    <a
                        href="/50-days-web-dev-challenge-/initiatives"
                        class="nav-link">
                        Initiatives
                    </a>
                </li>

                <li>
                    <a
                        href="/50-days-web-dev-challenge-/team"
                        class="nav-link">
                        Core Team
                    </a>
                </li>

                <li>
                    <a
                        href="/50-days-web-dev-challenge-/github"
                        class="nav-link">
                        GitHub Lookup
                    </a>
                </li>

            </ul>

            <button id="theme-toggle">
                🌙
            </button>

        </nav>
    </header>


    <!-- =========================
         SPA CONTENT
         app.js injects pages here
    ========================== -->

    <main id="app-root"></main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            &copy; 2026 Synexus. All Rights Reserved.
        </p>

        <a
            href="https://www.linkedin.com/company/synexus-core/"
            target="_blank"
            rel="noopener noreferrer">
            LinkedIn
        </a>

        |

        <a
            href="https://www.instagram.com/synexuscore/"
            target="_blank"
            rel="noopener noreferrer">
            Instagram
        </a>

    </footer>


    <!-- =========================
         MODAL
         Used by Initiatives
    ========================== -->

    <div
        id="modal"
        class="modal">

        <div class="modal-content">

            <span id="close-modal">
                &times;
            </span>

            <h2 id="modal-title"></h2>

            <p>
                This initiative is part of the Synexus community.
            </p>

        </div>

    </div>

</body>

</html>
