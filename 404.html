<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synexus</title>

    <script>
        const path = window.location.pathname;

        if (path !== "/" && !path.includes(".")) {
            sessionStorage.redirect = path;
            window.location.replace("/");
        }
    </script>
</head>

<body>
    <h2>Redirecting...</h2>
</body>
</html>
